name: CI Quality & Security Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Server Job ──────────────────────────────────────────────────────────────
  server:
    name: Server — Lint / Test / Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (Server Dependencies)
        run: npm audit --audit-level=high

      - name: Lint Code
        run: npm run lint

      - name: Run Server Tests
        run: npm test

  # ── Client Job ──────────────────────────────────────────────────────────────
  client:
    name: Client — Lint / Test / Build / Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Security Audit (Client Dependencies)
        run: npm audit --audit-level=high --omit=optional || true

      - name: Lint Code
        run: npm run lint

      - name: Run Client Tests
        run: npm test

      - name: Build React/Vite Client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: 1:000000000000:web:ci-placeholder