
name: CI Quality & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

# Cancel superseded runs on PR/feature branches, but never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── Smoke Test Job ──────────────────────────────────────────────────────────
  smoke:
    name: Smoke — Infrastructure Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Run Smoke Tests
        run: npm run test:smoke
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long

  # ── Server Job ──────────────────────────────────────────────────────────────
  server:
    name: Server — Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Server Tests
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/educrate_ci
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long

  # ── Client Job ──────────────────────────────────────────────────────────────
  client:
    name: Client — Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # Keep this flag until peer dependency conflicts are resolved.
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Code
        run: npm run lint

      - name: Run Client Tests
        run: npm test

      - name: Build React/Vite Client
        run: npm run build
        env:
          # Placeholders for CI only. Real production values live in Vercel.
          VITE_API_URL: http://localhost:5000/api
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: 1:000000000000:web:ci-placeholder
