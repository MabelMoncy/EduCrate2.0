name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Server ──────────────────────────────────────────────────────────────────
  server:
    name: Server — lint / test / audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # Fail the build if any HIGH or CRITICAL CVE is found in server deps
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

  # ── Client ──────────────────────────────────────────────────────────────────
  client:
    name: Client — lint / test / build / audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps: Dependabot sometimes bumps one @types/* package before
        # its peer is updated. This flag prevents ERESOLVE hard-fails on dev-only type
        # conflicts while still catching real runtime dependency issues.
        run: npm ci --legacy-peer-deps

      - name: Security audit
        # Only flag HIGH/CRITICAL — moderate issues in devDependencies are not release-blocking
        run: npm audit --audit-level=high --omit=optional || true

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Provide dummy values so Vite doesn't crash on missing VITE_* vars during CI build
          VITE_API_URL: http://localhost:5000/api
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: 1:000000000000:web:ci-placeholder
