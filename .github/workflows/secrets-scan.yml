name: Secret Scanning

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — Scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On PRs: scan only the diff (fast). On push: scan full history.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
