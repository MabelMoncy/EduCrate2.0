
name: NPM Audit

# Runs weekly and on demand. Also runs when dependency manifests or lockfiles
# change in a pull request.
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'client/package*.json'
      - 'server/package*.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── Root Workspace Audit ────────────────────────────────────────────────────
  root-audit:
    name: Audit — Root Workspaces (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit Root Workspace Dependencies
        run: npm audit --audit-level=high --omit=dev

  # ── Server and Client Audits ────────────────────────────────────────────────
  audit:
    name: Audit — ${{ matrix.project }} (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        project: [server, client]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Audit reads the lockfile, so dependency installation is not required.
      - name: npm audit (high and above, production dependencies only)
        run: npm audit --audit-level=high --omit=dev
